apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
    - host: 
      http:
        paths:
          - path: /dev
            pathType: Prefix
            backend:
              service:
                name: portfolio-service1
                port:
                  number: 8082
